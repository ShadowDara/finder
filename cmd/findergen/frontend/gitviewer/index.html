<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git Viewer – Commit-Größen</title><style>:root{--bg:#0f1115;--panel:#171a21;--border:#2a2e37;--text:#e6e8ee;--muted:#8b93a3;--accent:#5b9dff;--accent-soft:rgba(91, 157, 255, 0.15);--danger:#ff6b6b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}header{padding:24px 32px 12px;border-bottom:1px solid var(--border)}header h1{margin:0 0 4px;font-size:20px;font-weight:600}header p{margin:0;color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;padding:16px 32px;flex-wrap:wrap;align-items:center}.controls input{flex:1;min-width:260px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px}.controls input:focus{outline:0;border-color:var(--accent)}button{background:var(--accent);color:#0b0d11;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:0 0;border:1px solid var(--border);color:var(--text)}main{padding:0 32px 40px}#status{color:var(--muted);font-size:13px;padding:4px 0 16px;min-height:18px}#status.error{color:var(--danger)}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}thead th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}tbody td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:rgba(255,255,255,.02)}.hash{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent)}.msg{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.author,.date{color:var(--muted);white-space:nowrap}.size-cell{min-width:220px}.size-bar-wrap{display:flex;align-items:center;gap:10px}.size-bar-track{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;min-width:80px}.size-bar-fill{height:100%;background:var(--accent);border-radius:4px;width:0%;transition:width .3s ease}.size-label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;min-width:78px;text-align:right}.size-label.pending{color:var(--muted)}.size-label.err{color:var(--danger)}.diff-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:nowrap}.diff-added{color:#4caf7d}.diff-removed{color:var(--danger)}.diff-delta{color:var(--text);font-weight:600;margin-left:6px}.diff-root{display:inline-block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);padding:2px 6px;border-radius:4px}.diff-cell.pending{color:var(--muted)}.diff-cell.err{color:var(--danger)}.empty{color:var(--muted);padding:40px;text-align:center}</style></head><body><header><h1>Git Viewer</h1><p>Zeigt die Commit-Historie eines lokalen Git-Repos inklusive Repo-Größe je Commit (via System-Git).</p></header><div class="controls"><input id="repoInput" placeholder="Absoluter Pfad zum Git-Repository, z.B. /home/user/mein-projekt"> <button id="loadBtn">Laden</button> <button id="sizeAllBtn" class="secondary" disabled="disabled">Alle Größen berechnen</button></div><main><div id="status"></div><table id="commitTable" style="display:none"><thead><tr><th>Commit</th><th>Datum</th><th>Autor</th><th>Nachricht</th><th class="size-cell">Größe des Repos zu diesem Commit</th><th class="size-cell">Änderung durch diesen Commit</th></tr></thead><tbody id="commitBody"></tbody></table></main><script>const repoInput=document.getElementById("repoInput"),loadBtn=document.getElementById("loadBtn"),sizeAllBtn=document.getElementById("sizeAllBtn"),statusEl=document.getElementById("status"),table=document.getElementById("commitTable"),tbody=document.getElementById("commitBody");let currentRepo="",currentCommits=[],maxSizeSeen=0;const LAST_REPO_KEY="gitviewer_last_repo";try{const e=localStorage.getItem(LAST_REPO_KEY);e&&(repoInput.value=e)}catch(e){}function setStatus(e,t=!1){statusEl.textContent=e,statusEl.className=t?"error":""}function escapeHtml(e){const t=document.createElement("div");return t.textContent=e,t.innerHTML}function formatDate(e){try{return new Date(e).toLocaleString()}catch(t){return e}}async function loadCommits(){const e=repoInput.value.trim();if(e){currentRepo=e;try{localStorage.setItem(LAST_REPO_KEY,e)}catch(e){}loadBtn.disabled=!0,sizeAllBtn.disabled=!0,setStatus("Lade Commits …"),table.style.display="none",tbody.innerHTML="",maxSizeSeen=0;try{const t=await fetch(`/api/gitviewer/commits?repo=${encodeURIComponent(e)}`),n=await t.json();if(!t.ok)throw new Error(n.error||"Unbekannter Fehler");if(currentCommits=n||[],0===currentCommits.length)return setStatus("Keine Commits gefunden."),void(loadBtn.disabled=!1);renderRows(currentCommits),table.style.display="",setStatus(`${currentCommits.length} Commit(s) geladen. Größe wird pro Commit einzeln berechnet.`),sizeAllBtn.disabled=!1,loadBtn.disabled=!1,loadAllSizes()}catch(e){setStatus("Fehler: "+e.message,!0),loadBtn.disabled=!1}}else setStatus("Bitte einen Repo-Pfad angeben.",!0)}function renderRows(e){tbody.innerHTML=e.map(e=>`\n    <tr data-hash="${e.hash}">\n      <td class="hash" title="${e.hash}">${e.short}</td>\n      <td class="date">${formatDate(e.date)}</td>\n      <td class="author">${escapeHtml(e.author)}</td>\n      <td class="msg" title="${escapeHtml(e.message)}">${escapeHtml(e.message)}</td>\n      <td class="size-cell">\n        <div class="size-bar-wrap">\n          <div class="size-bar-track"><div class="size-bar-fill"></div></div>\n          <span class="size-label pending">…</span>\n        </div>\n      </td>\n      <td class="diff-cell pending">…</td>\n    </tr>\n  `).join("")}async function loadSizeForCommit(e){const t=tbody.querySelector(`tr[data-hash="${e}"]`);if(!t)return;const n=t.querySelector(".size-label"),s=t.querySelector(".size-bar-fill");try{const a=await fetch(`/api/gitviewer/size?repo=${encodeURIComponent(currentRepo)}&commit=${encodeURIComponent(e)}`),o=await a.json();if(!a.ok)throw new Error(o.error||"Fehler");n.textContent=o.sizeHuman,n.classList.remove("pending","err"),t.dataset.size=o.size,o.size>maxSizeSeen?(maxSizeSeen=o.size,updateAllBars()):s.style.width=maxSizeSeen>0?o.size/maxSizeSeen*100+"%":"0%"}catch(e){n.textContent="Fehler",n.classList.remove("pending"),n.classList.add("err"),n.title=e.message}}async function loadDiffSizeForCommit(e){const t=tbody.querySelector(`tr[data-hash="${e}"]`);if(!t)return;const n=t.querySelector(".diff-cell");try{const t=await fetch(`/api/gitviewer/diffsize?repo=${encodeURIComponent(currentRepo)}&commit=${encodeURIComponent(e)}`),s=await t.json();if(!t.ok)throw new Error(s.error||"Fehler");n.classList.remove("pending","err"),s.isRoot?n.innerHTML=`<span class="diff-root">Erster Commit</span> <span class="diff-added">${s.addedHuman}</span>`:n.innerHTML=`<span class="diff-added">${s.addedHuman}</span> / <span class="diff-removed">${s.removedHuman}</span><span class="diff-delta">(Δ ${s.deltaHuman})</span>`,n.title=`${s.filesChanged} Datei(en) geändert`}catch(e){n.textContent="Fehler",n.classList.remove("pending"),n.classList.add("err"),n.title=e.message}}function updateAllBars(){tbody.querySelectorAll("tr").forEach(e=>{const t=Number(e.dataset.size||0),n=e.querySelector(".size-bar-fill");void 0!==e.dataset.size&&n&&(n.style.width=maxSizeSeen>0?t/maxSizeSeen*100+"%":"0%")})}async function loadAllSizes(){sizeAllBtn.disabled=!0;for(const e of currentCommits)await Promise.all([loadSizeForCommit(e.hash),loadDiffSizeForCommit(e.hash)]);setStatus(`${currentCommits.length} Commit(s) geladen, alle Größen berechnet.`)}loadBtn.addEventListener("click",loadCommits),sizeAllBtn.addEventListener("click",loadAllSizes),repoInput.addEventListener("keydown",e=>{"Enter"===e.key&&loadCommits()})</script></body></html>

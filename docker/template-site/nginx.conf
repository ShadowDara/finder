server {
    listen 3014;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API-Anfragen an den findergen-Container weiterleiten
    # (findergen ist im selben Docker-Netzwerk unter diesem Namen erreichbar)
    location /api/ {
        proxy_pass http://findergen:3013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

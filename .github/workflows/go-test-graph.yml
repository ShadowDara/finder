name: Go Tests Graph

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/tests/test-results.svg"
      - ".github/tests/test-results.json"
      - ".github/tests/test-last-run"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check daily limit
        id: limit
        shell: bash
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          if [ -f .github/tests/test-last-run ]; then
            LAST_RUN=$(cat .github/tests/test-last-run)

            if [ "$LAST_RUN" = "$TODAY" ]; then
              echo "Already ran today ($TODAY). Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Running tests for $TODAY"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: steps.limit.outputs.skip != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        if: steps.limit.outputs.skip != 'true'
        id: tests
        shell: bash
        run: |
          set +e

          go test -json ./... > .github/tests/test-results.json

          TEST_EXIT_CODE=$?

          echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Generate test graph
        if: steps.limit.outputs.skip != 'true'
        run: |
          python3 <<'PY'
          import json
          import html
          from pathlib import Path

          events = []

          with open(".github/tests/test-results.json") as f:
              for line in f:
                  try:
                      events.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass

          passed = 0
          failed = 0
          skipped = 0
          total_duration = 0

          tests = []

          for event in events:
              action = event.get("Action")
              test = event.get("Test")
              package = event.get("Package")
              duration = event.get("Elapsed", 0) or 0

              if action == "pass" and test:
                  passed += 1
                  tests.append((test, package, "passed", duration))

              elif action == "fail" and test:
                  failed += 1
                  tests.append((test, package, "failed", duration))

              elif action == "skip" and test:
                  skipped += 1
                  tests.append((test, package, "skipped", duration))

              if action in ("pass", "fail") and not test:
                  total_duration += duration

          total = passed + failed + skipped

          if total > 0:
              pass_percent = passed / total * 100
          else:
              pass_percent = 0

          width = 1000
          height = 600

          def bar(x, y, width, value, maximum, color, label):
              if maximum:
                  w = width * value / maximum
              else:
                  w = 0

              return f"""
              <rect x="{x}" y="{y}" width="{width}" height="42"
                    rx="8" fill="#eeeeee"/>
              <rect x="{x}" y="{y}" width="{w}" height="42"
                    rx="8" fill="{color}"/>
              <text x="{x + 15}" y="{y + 28}"
                    font-size="20" font-family="Arial">
                  {html.escape(label)}: {value}
              </text>
              """

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
          width="{width}" height="{height}" viewBox="0 0 {width} {height}">

          <rect width="100%" height="100%" fill="white"/>

          <text x="50" y="65"
                font-size="36"
                font-family="Arial"
                font-weight="bold">
            Go Test Results
          </text>

          <text x="50" y="100"
                font-size="18"
                font-family="Arial"
                fill="#666">
            {total} tests · {total_duration:.2f}s
          </text>

          {bar(50, 140, 900, passed, max(total, 1), "#4caf50", "Passed")}
          {bar(50, 205, 900, failed, max(total, 1), "#f44336", "Failed")}
          {bar(50, 270, 900, skipped, max(total, 1), "#ff9800", "Skipped")}

          <text x="50" y="365"
                font-size="28"
                font-family="Arial"
                font-weight="bold">
            Pass rate: {pass_percent:.1f}%
          </text>

          <text x="50" y="410"
                font-size="20"
                font-family="Arial">
            Passed: {passed}
          </text>

          <text x="250" y="410"
                font-size="20"
                font-family="Arial">
            Failed: {failed}
          </text>

          <text x="450" y="410"
                font-size="20"
                font-family="Arial">
            Skipped: {skipped}
          </text>

          <text x="50" y="480"
                font-size="16"
                font-family="Arial"
                fill="#666">
            Generated by GitHub Actions
          </text>

          </svg>
          """

          Path(".github/tests/test-results.svg").write_text(svg)
          PY

      - name: Update last run
        if: steps.limit.outputs.skip != 'true'
        run: |
          mkdir -p .github
          date -u +%Y-%m-%d > .github/tests/test-last-run

      - name: Commit test results
        if: steps.limit.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/tests/test-results.svg .github/tests/test-results.json .github/tests/test-last-run

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Go test results"
            git push
          fi

      - name: Fail workflow if tests failed
        if: steps.limit.outputs.skip != 'true' && steps.tests.outputs.exit_code != '0'
        run: |
          echo "Go tests failed."
          exit 1
